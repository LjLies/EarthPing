# Builds EarthPing the way F-Droid's build server does, so F-Droid can reproduce the release APK
# and publish it with this signature: Google's SDK platform and build-tools installed by F-Droid's
# sdkmanager (from Google's servers, as on F-Droid's build server), and JDK 21. The runner's
# preinstalled SDK is deleted first, so its package revisions can't leak in.
#
# Every push and pull request is built and tested, with the APKs kept as workflow artifacts; a
# manual run (Actions → Build → Run workflow, on any branch) does the same for testing. Only a
# pushed tag v<versionName> (e.g. v0.4.4) publishes a GitHub Release.
name: Build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
# contents: write to publish releases
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: ${{ github.workspace }}/../android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache SDK downloads and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sdkmanager
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sdk-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/**', '.github/workflows/build.yml') }}
          restore-keys: sdk-${{ runner.os }}-
      # Maven Central rate-limits GitHub's shared runners (HTTP 429): fetch through Google's
      # public mirror of it. Same files, so the APK doesn't change.
      - name: Fetch Maven Central through Google's mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/central-mirror.gradle <<'EOF'
            def mirror = "https://maven-central.storage-download.googleapis.com/maven2/"
            def redirect = { RepositoryHandler repos ->
                repos.withType(MavenArtifactRepository).configureEach { repo ->
                    if (repo.url.toString().startsWith("https://repo.maven.apache.org/maven2")) {
                        repo.url = mirror
                    }
                }
            }
            def mirrorFirst = { RepositoryHandler repos ->
                def m = repos.maven { name = "CentralMirror"; url = mirror }
                repos.remove(m)
                repos.addFirst(m)
            }
            beforeSettings { settings ->
                mirrorFirst(settings.buildscript.repositories)
            }
            settingsEvaluated { settings ->
                mirrorFirst(settings.pluginManagement.repositories)
                redirect(settings.dependencyResolutionManagement.repositories)
            }
            allprojects {
                mirrorFirst(buildscript.repositories)
            }
          EOF
      - name: Install the SDK with F-Droid's sdkmanager
        run: |
          sudo rm -rf /usr/local/lib/android
          pipx install sdkmanager==0.7.2
          sdkmanager "platforms;android-35" "build-tools;34.0.0"
      # Optional: sign release builds with the release key. Store the keystore base64-encoded as
      # the repository secret RELEASE_KEYSTORE and its password as RELEASE_STORE_PASSWORD
      # (guide: LjLies/Android-Development). Without them the release APK comes out unsigned.
      - name: Release signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        if: env.RELEASE_KEYSTORE != ''
        run: |
          echo "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Unit tests and APKs
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease -ProbolectricRepoUrl=https://maven-central.storage-download.googleapis.com/maven2
      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      # Each APK is uploaded on its own and unzipped, so it downloads as an .apk named after the
      # version. The release APK only when signed: an unsigned one can't be installed.
      - name: Name the APKs after the version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "EarthPing-$version-debug.apk"
          echo "APK=EarthPing-$version-debug.apk" >> "$GITHUB_ENV"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "EarthPing-$version.apk"
            echo "RELEASE_APK=EarthPing-$version.apk" >> "$GITHUB_ENV"
          fi
      - name: Show the release signing certificate
        if: env.RELEASE_APK != ''
        run: '"$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs "$RELEASE_APK"'
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK }}
          archive: false
      - name: Upload signed release APK
        if: env.RELEASE_APK != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.RELEASE_APK }}
          archive: false
      # A tag v<versionName> publishes the signed APK as GitHub Release v<versionName>, with
      # the version's changelog from fastlane as its notes. LjL-Droid, the family F-Droid
      # repository, picks it up from there within the hour.
      - name: Publish the release for this tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: EarthPing
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version (expected v$version)"
            exit 1
          fi
          if [ -z "$RELEASE_APK" ]; then
            echo "::error::No signed release APK: the RELEASE_KEYSTORE secrets are missing"
            exit 1
          fi
          notes=fastlane/metadata/android/en-US/changelogs/$code.txt
          if [ ! -f "$notes" ]; then
            echo "::error::Missing changelog $notes for versionCode $code"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$RELEASE_APK" --verify-tag \
            --title "$APP_NAME $version" --notes-file "$notes"
